name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev dependencies
        # Include [mcp] so the optional-dependency MCP tests can run.
        # test_mcp_server.py uses pytest.importorskip to skip gracefully
        # if mcp is absent, so this is always safe.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp]"

      - name: Run linter
        run: python -m ruff check lorewiki skills tests

      - name: Run tests
        run: python -m pytest -q --tb=short

      - name: Run coverage
        run: python -m pytest --cov=lorewiki --cov-report=term-missing --cov-fail-under=80
