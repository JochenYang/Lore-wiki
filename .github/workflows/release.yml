name: Create GitHub Release

# Trigger on tag pushes that DON'T start with v (e.g. "release-0.7.4").
# Version tags (v*) are handled by publish.yml which builds + uploads to PyPI.
# This workflow is for documentation-only / non-publishing releases
# (e.g. sync commits, CHANGELOG bumps, README refreshes) that still
# deserve a GitHub Release entry for visibility.
#
# Release notes are auto-generated by GitHub (generate_release_notes: true)
# from the commit history between the previous release tag and this one.
# This is more accurate than parsing CHANGELOG.md because it captures
# every change (including ones the maintainer forgot to add to CHANGELOG).
on:
  push:
    tags:
      - "release-*"

permissions:
  contents: write   # required to create a release

jobs:
  release:
    name: Create release with auto-generated notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so GitHub can compute the diff

      - name: Determine previous release tag
        id: prev
        shell: bash
        # Use the most recent ``v*`` or ``release-*`` tag strictly older
        # than the current one as the comparison base. ``git describe``
        # with ``--tags`` walks tags in chronological order, so the first
        # match older than HEAD is the one we want.
        run: |
          PREV=$(git tag --sort=-creatordate --format='%(refname:short)' \
            | grep -E '^(v|release-)' \
            | grep -v "^${GITHUB_REF_NAME}$" \
            | head -n 1 || true)
          echo "previous_tag=${PREV:-}" >> "$GITHUB_OUTPUT"
          echo "Comparing from '${PREV:-<root>}' to '${GITHUB_REF_NAME}'"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          # Auto-generate notes from commit history. ``previous_tag`` pins
          # the comparison base so we don't pull in every commit since
          # the dawn of time when the default would otherwise walk all
          # tags. ``append_body: false`` ensures the auto-generated notes
          # aren't silently merged with any prior body.
          generate_release_notes: true
          previous_tag: ${{ steps.prev.outputs.previous_tag }}
          append_body: false
          draft: false
          prerelease: false