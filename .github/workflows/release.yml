name: Create GitHub Release

# Trigger on tag pushes that DON'T start with v (e.g. "release-0.7.4").
# Version tags (v*) are handled by publish.yml which builds + uploads to PyPI.
# This workflow is for documentation-only / non-publishing releases
# (e.g. sync commits, CHANGELOG bumps, README refreshes) that still
# deserve a GitHub Release entry for visibility.
#
# Release notes are generated from ``git log`` between the previous
# release-* or v* tag and the current one. We DO NOT use
# ``generate_release_notes: true`` because it only renders PR merge
# info, not direct commits — for projects that push straight to main
# that produces a useless "Full Changelog" link with no commit list.
on:
  push:
    tags:
      - "release-*"

permissions:
  contents: write   # required to create a release

jobs:
  release:
    name: Create release with git-log notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git log can walk commits

      - name: Resolve previous release tag
        id: prev
        shell: bash
        # Use the most recent ``v*`` or ``release-*`` tag strictly older
        # than the current one as the comparison base. ``git tag --sort``
        # with ``-creatordate`` walks tags in reverse-chronological order,
        # so the first match older than ``GITHUB_REF_NAME`` is the one
        # we want.
        run: |
          PREV=$(git tag --sort=-creatordate --format='%(refname:short)' \
            | grep -E '^(v|release-)' \
            | grep -v "^${GITHUB_REF_NAME}$" \
            | head -n 1 || true)
          echo "previous_tag=${PREV:-}" >> "$GITHUB_OUTPUT"
          echo "Comparing from '${PREV:-<root>}' to '${GITHUB_REF_NAME}'"

      - name: Generate release notes from git log
        id: notes
        shell: bash
        # Use ``git log`` to build a markdown commit list between the
        # previous release tag and the current one. ``git log`` walks
        # commits in reverse-chronological order (newest first), which
        # is the conventional release-notes layout.
        #
        # Falls back to a "Full Changelog" link when the comparison
        # base is the repo root (e.g. no previous tag exists) so the
        # body is never empty.
        run: |
          PREV="${{ steps.prev.outputs.previous_tag }}"
          if [ -z "$PREV" ]; then
            # No previous tag — produce a one-liner instead of a wall
            # of every commit since the dawn of time.
            NOTES="Initial release tag **${GITHUB_REF_NAME}**."
          else
            # ``%s`` prints the subject, ``%h`` the short SHA. ``-n 50``
            # caps the list at 50 commits so a runaway release can't
            # OOM the workflow log. ``%N`` forename decoration gives the
            # bullet the most natural-looking layout.
            NOTES=$(git log \
              --pretty=format:'- %s ([%h](https://github.com/JochenYang/Lore-wiki/commit/%H))' \
              -n 50 \
              "${PREV}..HEAD")
          fi
          {
            echo "body<<EOF"
            echo "## Changes in ${GITHUB_REF_NAME}"
            echo ""
            echo "${NOTES}"
            echo ""
            if [ -n "${PREV}" ]; then
              echo "**Full Changelog**: https://github.com/JochenYang/Lore-wiki/compare/${PREV}...${GITHUB_REF_NAME}"
            else
              echo "**Full Changelog**: https://github.com/JochenYang/Lore-wiki/commits/${GITHUB_REF_NAME}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false