name: Create GitHub Release

# Trigger on tag pushes that DON'T start with v (e.g. "release-0.7.4").
# Version tags (v*) are handled by publish.yml which builds + uploads to PyPI.
# This workflow is for documentation-only / non-publishing releases
# (e.g. sync commits, CHANGELOG bumps, README refreshes) that still
# deserve a GitHub Release entry for visibility.
on:
  push:
    tags:
      - "release-*"

permissions:
  contents: write   # required to create a release

jobs:
  release:
    name: Create release from CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read CHANGELOG section for this release
        id: changelog
        shell: bash
        # ``release-0.7.4`` -> version ``0.7.4``.
        # Walk CHANGELOG.md line by line, capture the section under
        # ``## [<version>]`` until the next ``## [`` (next version heading).
        # Falls back to the full CHANGELOG if the version isn't found.
        run: |
          VERSION="${GITHUB_REF_NAME#release-}"
          echo "Looking for CHANGELOG section: [${VERSION}]"
          BODY=$(python3 -c "
          import re, sys
          version = sys.argv[1]
          with open('CHANGELOG.md', encoding='utf-8') as f:
              text = f.read()
          # Match the version heading and capture everything until the
          # next version heading or end of file.
          pattern = re.compile(
              r'^## \[{}\].*?(?=^## \[|\Z'.format(re.escape(version)),
              re.MULTILINE | re.DOTALL,
          )
          m = pattern.search(text)
          body = m.group(0).rstrip() if m else text
          if not body.strip():
              body = text
          sys.stdout.write(body)
          " "$VERSION")
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            CHANGELOG.md