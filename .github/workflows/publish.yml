name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build + verify only, do not publish.
        required: false
        default: "false"

jobs:
  publish:
    name: Build + publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for PyPI trusted publishing (OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # so setup-python can read the version tag

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2" "hatchling>=1.27" "twine>=6.1"

      - name: Run tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - name: Run linter
        run: python -m ruff check lorewiki skills tests

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify metadata
        run: python -m twine check dist/*

      - name: Publish to PyPI
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run != 'true')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # No password or token. The OIDC id-token granted by
          # permissions: id-token: write above is exchanged with
          # the PyPI trusted publisher configured at
          # https: //pypi.org/manage/account/publishing/ for a
          # short-lived upload token. (We deliberately avoid the
          # "://" scheme in the comment so YAML does not mistake
          # the colon for a key/value separator.)
          verbose: true
